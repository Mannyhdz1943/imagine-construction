<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Imagine Construction Leads</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --gold:#C8972A;--gold-light:#E5B84A;--dark:#0F1114;--dark2:#1A1D22;--dark3:#252830;--white:#F5F3EE;--gray:#8A8D94;--green:#27AE60;--red:#C0392B;--orange:#E67E22; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Source Sans 3',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;}
    #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .login-box{background:var(--dark2);border:2px solid var(--gold);border-radius:8px;padding:48px 40px;width:100%;max-width:380px;text-align:center;}
    .login-box h1{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
    .login-box p{color:var(--gray);font-size:0.9rem;margin-bottom:28px;}
    .login-box input{width:100%;background:var(--dark3);border:1px solid #444;border-radius:4px;color:var(--white);padding:12px 14px;font-size:1rem;font-family:'Source Sans 3',sans-serif;margin-bottom:14px;text-align:center;letter-spacing:4px;}
    .login-box input:focus{outline:none;border-color:var(--gold);}
    .login-btn{width:100%;background:var(--gold);color:var(--dark);font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px;border:none;border-radius:4px;cursor:pointer;}
    .login-btn:hover{background:var(--gold-light);}
    .login-error{color:#e74c3c;font-size:0.85rem;margin-top:10px;display:none;}
    #dashboard{display:none;}
    header{background:var(--dark2);border-bottom:2px solid var(--gold);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
    .logo{font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:1px;}
    .logo span{color:var(--gold);}
    .logout-btn{background:transparent;border:1px solid #555;color:var(--gray);font-size:0.8rem;padding:6px 14px;border-radius:4px;cursor:pointer;font-family:'Source Sans 3',sans-serif;}
    .logout-btn:hover{border-color:var(--red);color:var(--red);}
    .main{padding:24px;max-width:1400px;margin:0 auto;}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px;}
    .stat-card{background:var(--dark2);border:1px solid #333;border-radius:6px;padding:20px;text-align:center;}
    .stat-card .num{font-family:'Oswald',sans-serif;font-size:2.2rem;font-weight:700;}
    .stat-card .lbl{font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-top:4px;}
    .stat-card.gold .num{color:var(--gold);}
    .stat-card.blue .num{color:#5dade2;}
    .stat-card.orange .num{color:var(--orange);}
    .stat-card.green .num{color:#5dde8a;}
    .filters{background:var(--dark2);border:1px solid #333;border-radius:6px;padding:16px 20px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
    .filters input,.filters select{background:var(--dark3);border:1px solid #444;border-radius:4px;color:var(--white);padding:8px 12px;font-size:0.9rem;font-family:'Source Sans 3',sans-serif;}
    .filters input:focus,.filters select:focus{outline:none;border-color:var(--gold);}
    .filters input{flex:1;min-width:180px;}
    .clear-btn{background:transparent;border:1px solid #555;color:var(--gray);padding:8px 14px;border-radius:4px;cursor:pointer;font-size:0.85rem;font-family:'Source Sans 3',sans-serif;}
    .clear-btn:hover{color:var(--white);}
    .table-wrap{overflow-x:auto;background:var(--dark2);border:1px solid #333;border-radius:6px;}
    table{width:100%;border-collapse:collapse;min-width:700px;}
    thead{border-bottom:2px solid var(--gold);}
    th{font-family:'Oswald',sans-serif;font-size:0.75rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gray);padding:12px 16px;text-align:left;}
    td{padding:12px 16px;border-bottom:1px solid #2a2d32;font-size:0.9rem;}
    tr:hover td{background:var(--dark3);}
    tr:last-child td{border-bottom:none;}
    .badge{display:inline-block;font-size:0.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:12px;white-space:nowrap;}
    .badge-new{background:#1a3d5c;color:#5dade2;}
    .badge-contacted{background:#3d2d1a;color:var(--gold-light);}
    .badge-progress{background:#3d2a1a;color:#f0a500;}
    .badge-closed{background:#1a3d28;color:#5dde8a;}
    .action-btn{background:transparent;border:1px solid #555;color:var(--gray);font-size:0.75rem;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:'Source Sans 3',sans-serif;transition:all 0.2s;margin-right:4px;white-space:nowrap;}
    .action-btn:hover{border-color:var(--gold);color:var(--gold);}
    .action-btn.call:hover{border-color:var(--green);color:var(--green);}
    .empty-state{text-align:center;padding:60px 20px;color:var(--gray);}
    .empty-state h3{font-family:'Oswald',sans-serif;font-size:1.3rem;margin-bottom:8px;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--dark2);border:2px solid var(--gold);border-radius:8px;padding:32px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;}
    .modal h2{font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;}
    .modal-row{display:flex;flex-direction:column;margin-bottom:14px;}
    .modal-label{font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:4px;}
    .modal-val{font-size:1rem;}
    .modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
    .modal-close{background:transparent;border:1px solid #555;color:var(--gray);padding:8px 18px;border-radius:4px;cursor:pointer;font-family:'Source Sans 3',sans-serif;}
    .status-select{background:var(--dark3);border:1px solid #444;border-radius:4px;color:var(--white);padding:8px 12px;font-size:0.9rem;font-family:'Source Sans 3',sans-serif;flex:1;}
    .loading{text-align:center;padding:40px;color:var(--gray);}
  </style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <h1>Admin <span style="color:var(--gold)">Panel</span></h1>
    <p>Imagine Construction & Design</p>
    <input type="password" id="pwInput" placeholder="Password" onkeypress="if(event.key==='Enter')login()" />
    <button class="login-btn" onclick="login()">Enter</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="logo">IMAGINE <span>CONSTRUCTION</span> — LEADS</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <span id="leadCount" style="color:var(--gray);font-size:0.85rem;"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="main">
    <div class="stats">
      <div class="stat-card gold"><div class="num" id="statTotal">0</div><div class="lbl">Total Leads</div></div>
      <div class="stat-card blue"><div class="num" id="statNew">0</div><div class="lbl">New</div></div>
      <div class="stat-card orange"><div class="num" id="statProgress">0</div><div class="lbl">In Progress</div></div>
      <div class="stat-card green"><div class="num" id="statClosed">0</div><div class="lbl">Closed</div></div>
    </div>
    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍 Search name, phone, email, ZIP..." oninput="filterTable()" />
      <select id="filterStatus" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option>New</option><option>Contacted</option><option>In Progress</option><option>Closed</option>
      </select>
      <select id="filterService" onchange="filterTable()">
        <option value="">All Services</option>
        <option>Remodeling</option><option>Plumbing</option><option>Electrical</option><option>Roofing</option>
        <option>Windows & Doors</option><option>Painting</option><option>Flooring</option>
        <option>Bathroom Remodel</option><option>Kitchen Remodel</option><option>New Construction</option>
        <option>HVAC</option><option>Masonry</option><option>Other</option>
      </select>
      <button class="clear-btn" onclick="clearFilters()">Clear</button>
      <button class="clear-btn" onclick="loadLeads()" style="border-color:var(--gold);color:var(--gold);">🔄 Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Name</th><th>Phone</th><th>ZIP</th><th>Service</th><th>Urgency</th><th>Budget</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="leadsTable"><tr><td colspan="9" class="loading">Loading leads...</td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">
        <h3>No leads yet</h3>
        <p>Leads submitted through your website will appear here.</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
  const SUPABASE_URL = 'https://rvlpmbdxgbdnvltneggg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4ho__nRrvRrmErmH0YBFsg_mShz83XD';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);
  const PASSWORD = 'admin123';
  let allLeads = [];

  function login() {
    if (document.getElementById('pwInput').value === PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadLeads();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('pwInput').value = '';
  }

  async function loadLeads() {
    const { data, error } = await db.from('leads').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allLeads = data || [];
    updateStats();
    filterTable();
    document.getElementById('leadCount').textContent = allLeads.length + ' total leads';
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = allLeads.length;
    document.getElementById('statNew').textContent = allLeads.filter(l => l.status === 'New').length;
    document.getElementById('statProgress').textContent = allLeads.filter(l => l.status === 'In Progress' || l.status === 'Contacted').length;
    document.getElementById('statClosed').textContent = allLeads.filter(l => l.status === 'Closed').length;
  }

  function filterTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('filterStatus').value;
    const service = document.getElementById('filterService').value;
    let filtered = allLeads.filter(l => {
      const s = `${l.first_name} ${l.last_name} ${l.phone} ${l.email} ${l.zip}`.toLowerCase();
      return (!search || s.includes(search)) && (!status || l.status === status) && (!service || l.service === service);
    });
    const tbody = document.getElementById('leadsTable');
    document.getElementById('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';
    tbody.innerHTML = filtered.map(l => `
      <tr>
        <td>${new Date(l.created_at).toLocaleDateString()}</td>
        <td><strong>${l.first_name} ${l.last_name}</strong></td>
        <td>${l.phone}</td>
        <td>${l.zip}</td>
        <td>${l.service}</td>
        <td>${l.urgency || '—'}</td>
        <td>${l.budget || '—'}</td>
        <td><span class="badge ${badgeClass(l.status)}">${l.status}</span></td>
        <td>
          <button class="action-btn call" onclick="window.location='tel:${l.phone}'">📞 Call</button>
          <button class="action-btn" onclick="openModal(${l.id})">View</button>
        </td>
      </tr>`).join('');
  }

  function badgeClass(s) {
    return {New:'badge-new',Contacted:'badge-contacted','In Progress':'badge-progress',Closed:'badge-closed'}[s]||'badge-new';
  }

  function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterService').value = '';
    filterTable();
  }

  function openModal(id) {
    const l = allLeads.find(x => x.id === id);
    if (!l) return;
    document.getElementById('modal').innerHTML = `
      <h2>Lead Details</h2>
      <div class="modal-row"><div class="modal-label">Name</div><div class="modal-val">${l.first_name} ${l.last_name}</div></div>
      <div class="modal-row"><div class="modal-label">Phone</div><div class="modal-val"><a href="tel:${l.phone}" style="color:var(--gold)">${l.phone}</a></div></div>
      <div class="modal-row"><div class="modal-label">Email</div><div class="modal-val">${l.email||'—'}</div></div>
      <div class="modal-row"><div class="modal-label">ZIP</div><div class="modal-val">${l.zip}</div></div>
      <div class="modal-row"><div class="modal-label">Service</div><div class="modal-val">${l.service}</div></div>
      <div class="modal-row"><div class="modal-label">Urgency</div><div class="modal-val">${l.urgency||'—'}</div></div>
      <div class="modal-row"><div class="modal-label">Budget</div><div class="modal-val">${l.budget||'—'}</div></div>
      <div class="modal-row"><div class="modal-label">Description</div><div class="modal-val">${l.description||'—'}</div></div>
      <div class="modal-row"><div class="modal-label">Date</div><div class="modal-val">${new Date(l.created_at).toLocaleString()}</div></div>
      <div class="modal-row">
        <div class="modal-label">Update Status</div>
        <select class="status-select" id="statusSel">
          <option ${l.status==='New'?'selected':''}>New</option>
          <option ${l.status==='Contacted'?'selected':''}>Contacted</option>
          <option ${l.status==='In Progress'?'selected':''}>In Progress</option>
          <option ${l.status==='Closed'?'selected':''}>Closed</option>
        </select>
      </div>
      <div class="modal-actions">
        <a href="tel:${l.phone}" class="action-btn call" style="text-decoration:none;padding:8px 16px;">📞 Call</a>
        ${l.email?`<a href="mailto:${l.email}" class="action-btn" style="text-decoration:none;padding:8px 16px;">✉️ Email</a>`:''}
        <button class="action-btn" onclick="saveStatus(${l.id})">💾 Save Status</button>
        <button class="modal-close" onclick="closeModal()">Close</button>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
  }

  async function saveStatus(id) {
    const newStatus = document.getElementById('statusSel').value;
    await db.from('leads').update({ status: newStatus }).eq('id', id);
    closeModal();
    loadLeads();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
</script>
</body>
</html>
